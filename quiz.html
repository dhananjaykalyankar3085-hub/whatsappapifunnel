<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwali WhatsApp Check | 10xBizFunnel</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .qtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .qtop .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; max-width: 760px; }
  .qtop .count { margin-left: auto; font-weight: 600; color: var(--ink-2); font-size: .95rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 5px; background: var(--line); }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

  .stage { max-width: 760px; margin: 0 auto; padding-block: 28px 48px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 26px 22px; }
  @media (min-width: 600px) { .card { padding: 34px 34px; } }
  .card.enter { animation: enter .28s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .sec { font-family: var(--font-display); font-weight: 700; color: var(--brand); font-size: .98rem; margin: 0 0 6px; }
  .card h1 { font-size: clamp(1.55rem, 5vw, 2.1rem); line-height: 1.2; margin-bottom: .3em; }
  .why { color: var(--muted); font-size: .98rem; margin: 0 0 18px; }
  .info { background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: var(--r-md); padding: 14px 16px; margin: 0 0 18px; color: #4D3400; }
  .info b { color: #3A2700; }

  .opts { display: grid; gap: 10px; }
  @media (min-width: 600px) { .opts.two { grid-template-columns: 1fr 1fr; } }
  .opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%;
    font: inherit; font-size: 1.06rem; font-weight: 600; color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; min-height: 58px; cursor: pointer;
    transition: border-color .12s ease, background .12s ease; }
  .opt:hover { border-color: var(--accent); background: #F7FCF9; }
  .opt .k { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--line); display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 700; color: var(--ink-2); font-size: .95rem; background: var(--bg); }
  .opt.sel { border-color: var(--accent); background: var(--tint); }
  .opt.sel .k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt .ic { margin-right: 6px; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; min-height: 40px; }
  .back { background: none; border: 0; font: inherit; color: var(--ink-2); cursor: pointer; padding: 8px 4px; font-weight: 600; }
  .back:hover { color: var(--brand); }
  .trust { text-align: center; color: var(--muted); font-size: .88rem; margin-top: 18px; }

  .analyzing { text-align: center; }
  .spinner { width: 54px; height: 54px; border-radius: 50%; border: 5px solid var(--tint); border-top-color: var(--accent); margin: 6px auto 18px; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .checks { list-style: none; padding: 0; margin: 16px auto 0; max-width: 380px; text-align: left; }
  .checks li { padding: 8px 0 8px 34px; position: relative; color: var(--muted); }
  .checks li::before { content: ""; position: absolute; left: 0; top: 9px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); }
  .checks li.done { color: var(--ink); font-weight: 600; }
  .checks li.done::before { content: "✓"; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: .8rem; font-weight: 800; display: grid; place-items: center; }

  .ready { display: inline-flex; gap: 8px; align-items: center; background: var(--tint); color: var(--accent-ink); font-weight: 700; border-radius: 999px; padding: 4px 14px; margin-bottom: 12px; font-size: .95rem; }
  .form-grid { display: grid; gap: 12px; margin-top: 8px; }
  @media (min-width: 600px) { .form-grid { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }
  .field { min-width: 0; }
  .field label { display: block; font-size: .92rem; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
  .field input { width: 100%; font: inherit; font-size: 1.05rem; padding: 12px 13px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
  .field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(37, 211, 102, .2); }
  .field .err { color: var(--danger); font-size: .86rem; min-height: 1.2em; display: block; }
  .phone-in { display: flex; }
  .phone-in span { padding: 12px 11px; border: 1.5px solid var(--line); border-right: 0; border-radius: var(--r-sm) 0 0 var(--r-sm); background: var(--bg); color: var(--ink-2); font-weight: 600; }
  .phone-in input { border-radius: 0 var(--r-sm) var(--r-sm) 0; min-width: 0; }
  .privacy { font-size: .86rem; color: var(--muted); margin: 6px 0 14px; }
</style>
</head>
<body>

<header class="qtop">
  <div class="wrap">
    <a class="brand" href="index.html" data-brand aria-label="10xBizFunnel"></a>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</header>

<main class="wrap stage">
  <div id="screen"></div>
  <p class="trust">🔒 तुमची माहिती सुरक्षित आहे. Spam calls नाहीत.</p>
</main>

<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
(function () {
  var C = window.FUNNEL_CONFIG || {};
  var esc = window.FUNNEL.esc;

  /* QUESTIONS — key = GHL custom field key. The option text (t) is the value saved
     in GHL, so keep GHL dropdown/radio options identical. pts = lead score, tag = GHL tag. */
  var Q = [
    { key: "business_type", sec: "तुमचं shop", two: true,
      q: "तुमचा business कुठला आहे?",
      why: "प्रत्येक business साठी WhatsApp वेगळ्या पद्धतीने वापरला जातो. तुमचा plan त्यानुसार बनेल.",
      opts: [
        { t: "Jewellery", i: "💍" }, { t: "Saree", i: "🥻" }, { t: "Clothing", i: "👕" },
        { t: "Electronics", i: "📺" }, { t: "Furniture", i: "🛋️" }, { t: "Home Appliances", i: "🧺" },
        { t: "Other", i: "🏪" }
      ] },
    { key: "customer_database_size", sec: "तुमचं shop",
      q: "तुमच्याकडे किती customers चे mobile numbers आहेत?",
      why: "Billing software, diary, phone contacts, सगळे मिळून अंदाजे सांगा.",
      opts: [
        { t: "500 पेक्षा कमी", pts: 0 }, { t: "500 ते 2,000", pts: 5 },
        { t: "2,000 ते 10,000", pts: 10 }, { t: "10,000 पेक्षा जास्त", pts: 15 }
      ] },
    { key: "current_offer_method", sec: "आत्ताची पद्धत",
      q: "सध्या offers customers पर्यंत कशा पोहोचवता?",
      why: "यावरून तुमच्या shop मधून customers नेमके कुठे निसटतायत ते समजेल.",
      opts: [
        { t: "Personal WhatsApp वरून एकेकाला" }, { t: "WhatsApp Broadcast list" },
        { t: "SMS" }, { t: "अजून काहीच पाठवत नाही" }
      ] },
    { key: "diwali_main_problem", sec: "आत्ताची पद्धत",
      q: "Diwali season मध्ये सगळ्यात जास्त त्रास कशाचा होतो?",
      why: "तुमच्या plan मध्ये याच problem चं solution सगळ्यात आधी दिसेल.",
      opts: [
        { t: "Inquiries ना वेळेवर reply देता येत नाही" }, { t: "जुने customers परत येत नाहीत" },
        { t: "Staff ला सगळं manage होत नाही" }, { t: "Payment आणि follow-up राहून जातं" }
      ] },
    { key: "staff_size", sec: "तुमची team",
      q: "Shop मध्ये तुमच्यासोबत किती staff आहे?",
      why: "किती लोक एकाच WhatsApp number वरून काम करतील, ते plan मध्ये धरू.",
      opts: [
        { t: "मी एकटाच", pts: 0 }, { t: "1 ते 3", pts: 5 },
        { t: "4 ते 10", pts: 10 }, { t: "10 पेक्षा जास्त / branches आहेत", pts: 15 }
      ] },
    { key: "decision_maker", sec: "तुमची team",
      q: "Shop च्या marketing चा final decision कोण घेतं?",
      why: "Demo मध्ये decision घेणारी व्यक्ती असली की वेळ वाचतो.",
      opts: [
        { t: "मी स्वतः (owner)", pts: 15 },
        { t: "मी आणि partner मिळून", pts: 10 },
        { t: "मी staff आहे, decision owner घेतात", pts: 0, tag: "not-decision-maker" }
      ] },
    { key: "business_document", sec: "Eligibility",
      q: "तुमच्याकडे Udyam Aadhaar (MSME registration) आहे का?",
      why: "Official WhatsApp API साठी Meta तुमच्या business चं verification करतं. त्यासाठी हे लागतं.",
      opts: [
        { t: "हो, Udyam Aadhaar आहे", pts: 15, tag: "udyam-yes" },
        { t: "Udyam नाही, पण GST आहे", pts: 10, tag: "gst-only" },
        { t: "दोन्ही नाही", pts: 0, tag: "no-documents" }
      ] },
    { key: "start_timeline", sec: "Eligibility",
      q: "हे कधी पासून सुरू करायचं आहे?",
      why: "Meta verification ला काही दिवस लागतात, म्हणून timeline महत्त्वाची आहे.",
      opts: [
        { t: "Diwali पूर्वी, लगेच", pts: 15, tag: "before-diwali" },
        { t: "Diwali नंतर 1-2 महिन्यांत", pts: 8 },
        { t: "अजून ठरवलं नाही", pts: 2 }
      ] },
    { key: "budget_readiness", sec: "शेवटचा प्रश्न",
      info: true,
      q: "हे लक्षात घेऊन, तुम्ही ready आहात का?",
      why: "उत्तर काहीही असलं तरी तुम्हाला उपयोगी पडेल असा plan मिळेल.",
      opts: [
        { t: "हो, योग्य वाटलं तर लगेच start करायचं", pts: 20, tag: "budget-ready" },
        { t: "आधी नीट समजून घ्यायचं आहे", pts: 8 },
        { t: "नाही, मला फक्त free information हवी", pts: 0, tag: "free-only" }
      ] }
  ];

  var screen = document.getElementById("screen");
  var bar = document.getElementById("bar");
  var count = document.getElementById("count");
  var answers = {};
  var step = 0;
  var locked = false;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var LET = "ABCDEFG";

  function setProgress(n) { bar.style.width = Math.round((n / (Q.length + 1)) * 100) + "%"; }

  function render() {
    var q = Q[step];
    count.textContent = "Question " + (step + 1) + " / " + Q.length;
    setProgress(step);
    var html = '<div class="card enter">' +
      '<p class="sec">' + esc(q.sec) + '</p>' +
      (q.info ? '<div class="info">एक गोष्ट आधीच clear करतो: Official WhatsApp API setup <b>' + esc(C.priceBasic) +
        '</b> पासून सुरू होतो. <b>' + esc(C.demoPrice) + '</b> ही फक्त 30 minutes च्या Live Demo ची booking fee आहे, tool ची किंमत नाही.</div>' : "") +
      '<h1 id="qh">' + esc(q.q) + '</h1>' +
      '<p class="why">' + esc(q.why) + '</p>' +
      '<div class="opts' + (q.two ? " two" : "") + '" role="radiogroup" aria-labelledby="qh">' +
      q.opts.map(function (o, i) {
        var sel = answers[q.key] === o;
        return '<button type="button" role="radio" aria-checked="' + sel + '" class="opt' + (sel ? " sel" : "") + '" data-i="' + i + '">' +
          '<span class="k">' + LET[i] + '</span><span>' + (o.i ? '<span class="ic">' + o.i + '</span>' : "") + esc(o.t) + '</span></button>';
      }).join("") + '</div>' +
      '<div class="nav">' + (step > 0 ? '<button type="button" class="back" id="back">← मागे</button>' : "<span></span>") + '</div>' +
      '</div>';
    screen.innerHTML = html;
    locked = false;
    screen.querySelectorAll(".opt").forEach(function (b) {
      b.addEventListener("click", function () { pick(q, +b.getAttribute("data-i"), b); });
    });
    var bk = document.getElementById("back");
    if (bk) bk.addEventListener("click", function () { step--; render(); });
    if (step > 0) { var h = document.getElementById("qh"); h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
    window.scrollTo(0, 0);
  }

  function pick(q, i, btn) {
    if (locked) return; locked = true;
    answers[q.key] = q.opts[i];
    screen.querySelectorAll(".opt").forEach(function (b) { b.classList.remove("sel"); b.setAttribute("aria-checked", "false"); });
    btn.classList.add("sel"); btn.setAttribute("aria-checked", "true");
    setTimeout(function () {
      step++;
      if (step < Q.length) render(); else analyzing();
    }, reduce ? 0 : 260);
  }

  /* ---------- "Building your plan" moment ---------- */
  function analyzing() {
    count.textContent = "Plan तयार होतोय";
    setProgress(Q.length);
    var biz = answers.business_type ? answers.business_type.t : "";
    screen.innerHTML = '<div class="card enter analyzing">' +
      '<div class="spinner" aria-hidden="true"></div>' +
      '<h1>तुमचा Diwali WhatsApp Plan तयार होतोय…</h1>' +
      '<ul class="checks">' +
      '<li>' + (biz && biz !== "Other" ? esc(biz) + " shop साठी" : "तुमच्या shop साठी") + ' best features निवडतोय</li>' +
      '<li>तुमच्या customers च्या संख्येनुसार plan बसवतोय</li>' +
      '<li>तुमच्या मुख्य problem चं solution जोडतोय</li>' +
      '</ul></div>';
    var items = screen.querySelectorAll(".checks li"), k = 0;
    var t = setInterval(function () {
      if (k < items.length) { items[k++].classList.add("done"); return; }
      clearInterval(t); contactGate();
    }, reduce ? 150 : 650);
  }

  /* ---------- Contact gate ---------- */
  function contactGate() {
    count.textContent = "शेवटची step";
    screen.innerHTML = '<div class="card enter">' +
      '<span class="ready">✅ तुमचा plan ready आहे</span>' +
      '<h1>तुमचा Diwali WhatsApp Plan कोणाच्या नावाने तयार करू?</h1>' +
      '<p class="why">Details भरा, तुमचा personalized plan लगेच पुढच्या page वर उघडेल.</p>' +
      '<form id="cform" novalidate><div class="form-grid">' +
      fld("name", "तुमचं नाव", "text", "उदा. राहुल पाटील", "name") +
      '<div class="field"><label for="phone">WhatsApp number</label><div class="phone-in"><span>+91</span>' +
        '<input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="10 अंकी number" required></div><span class="err" id="e-phone"></span></div>' +
      fld("email", "Email", "email", "उदा. shop@gmail.com", "email") +
      fld("business_name", "Shop चं नाव", "text", "उदा. पाटील ज्वेलर्स", "organization") +
      fld("city", "शहर", "text", "उदा. नांदेड", "address-level2", true) +
      '</div>' +
      '<p class="privacy">Submit केल्यावर तुमचा plan लगेच दिसेल. आमची team WhatsApp वर फक्त demo संदर्भात संपर्क करेल.</p>' +
      '<button class="btn btn-block" type="submit" id="sbtn">माझा Diwali Plan बघा</button>' +
      '</form></div>';
    document.getElementById("cform").addEventListener("submit", submit);
    document.getElementById("name").focus({ preventScroll: true });
  }
  function fld(id, label, type, ph, ac, full) {
    return '<div class="field' + (full ? " full" : "") + '"><label for="' + id + '">' + label + '</label>' +
      '<input id="' + id + '" name="' + id + '" type="' + type + '" placeholder="' + ph + '" autocomplete="' + ac + '" required>' +
      '<span class="err" id="e-' + id + '"></span></div>';
  }
  function val(id) { return (document.getElementById(id).value || "").trim(); }
  function setErr(id, m) { document.getElementById("e-" + id).textContent = m || ""; }
  function validate() {
    var ok = true;
    ["name", "phone", "email", "business_name", "city"].forEach(function (k) { setErr(k, ""); });
    if (val("name").length < 2) { setErr("name", "तुमचं नाव लिहा."); ok = false; }
    if (!/^[6-9]\d{9}$/.test(val("phone").replace(/\D/g, ""))) { setErr("phone", "10 अंकी mobile number लिहा (6, 7, 8 किंवा 9 ने सुरू होणारा)."); ok = false; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val("email"))) { setErr("email", "बरोबर email लिहा, उदा. name@gmail.com"); ok = false; }
    if (val("business_name").length < 2) { setErr("business_name", "Shop चं नाव लिहा."); ok = false; }
    if (val("city").length < 2) { setErr("city", "शहराचं नाव लिहा."); ok = false; }
    return ok;
  }

  function score() {
    var s = 0, tags = ["diwali-wa-quiz"];
    Q.forEach(function (q) { var o = answers[q.key]; if (!o) return; s += o.pts || 0; if (o.tag) tags.push(o.tag); });
    var freeOnly = tags.indexOf("free-only") > -1, noDocs = tags.indexOf("no-documents") > -1;
    var cat = freeOnly ? "COLD" : s >= 70 ? "HOT" : s >= 40 ? "WARM" : "COLD";
    tags.push(cat);
    return { score: s, category: cat, tags: tags, freeOnly: freeOnly, noDocs: noDocs };
  }
  function utm() {
    var p = new URLSearchParams(location.search), o = {};
    ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "fbclid"].forEach(function (k) { if (p.get(k)) o[k] = p.get(k); });
    return o;
  }
  function send(payload) {
    if (!C.ghlWebhookUrl) { console.warn("config.js मध्ये ghlWebhookUrl नाही, lead GHL ला गेला नाही.", payload); return Promise.resolve(); }
    var timeout = new Promise(function (r) { setTimeout(r, 4000); });
    var req = fetch(C.ghlWebhookUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), keepalive: true })
      .catch(function () {
        var fd = new URLSearchParams();
        Object.keys(payload).forEach(function (k) { fd.append(k, payload[k]); });
        return fetch(C.ghlWebhookUrl, { method: "POST", mode: "no-cors", body: fd, keepalive: true }).catch(function () {});
      });
    return Promise.race([req, timeout]);
  }

  function submit(e) {
    e.preventDefault();
    if (!validate()) { var bad = screen.querySelector(".err:not(:empty)"); if (bad) { var f = bad.parentNode.querySelector("input"); if (f) f.focus(); } return; }
    var btn = document.getElementById("sbtn"); btn.disabled = true; btn.textContent = "Plan उघडतोय…";
    var r = score(), full = val("name");
    var payload = {
      full_name: full, first_name: full.split(/\s+/)[0], last_name: full.split(/\s+/).slice(1).join(" "),
      phone: "+91" + val("phone").replace(/\D/g, ""), email: val("email"),
      business_name: val("business_name"), city: val("city"),
      lead_score: r.score, lead_category: r.category, quiz_tags: r.tags.join(","),
      route: (r.freeOnly || r.noDocs) ? "free-guide" : "result",
      source: "whatsapp-diwali-quiz", page_url: location.href, submitted_at: new Date().toISOString()
    };
    Q.forEach(function (q) { payload[q.key] = answers[q.key] ? answers[q.key].t : ""; });
    var u = utm(); Object.keys(u).forEach(function (k) { payload[k] = u[k]; });
    try { localStorage.setItem("wa_quiz_lead", JSON.stringify(payload)); } catch (err) {}
    var px = { content_name: "Diwali WhatsApp Check", lead_score: r.score, lead_category: r.category, business_type: payload.business_type };
    window.FUNNEL.track("Lead", px);
    // QualifiedLead: only HOT / WARM leads. Optimise the Meta campaign on this event for better lead quality.
    if (r.category === "HOT" || r.category === "WARM") window.FUNNEL.trackCustom("QualifiedLead", px);

    var minWait = new Promise(function (res) { setTimeout(res, 700); }); // let the pixel send before the page changes
    Promise.all([send(payload), minWait]).then(function () {
      var n = encodeURIComponent(payload.first_name);
      if (r.freeOnly || r.noDocs) location.href = "free.html?reason=" + (r.freeOnly ? "free" : "docs") + "&n=" + n;
      else location.href = "result.html?biz=" + encodeURIComponent(payload.business_type) + "&n=" + n;
    });
  }

  /* ---------- Start (Q1 may be pre-answered from the landing page) ---------- */
  var pre = new URLSearchParams(location.search).get("biz");
  var preOpt = pre && Q[0].opts.filter(function (o) { return o.t === pre; })[0];
  if (preOpt) { answers.business_type = preOpt; step = 1; }
  render();
})();
</script>
</body>
</html>
